<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Payroll Demo — Fix Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #0C911C;
      --green-light: #e8f7ea;
      --green-mid: #c3e8c8;
      --dark: #0c0c0c;
      --medium: #6e6969;
      --light: #f8f4f4;
      --border: #eee;
      --white: #fff;
      --danger: #ff5252;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo-dot {
      width: 36px; height: 36px;
      background: var(--green);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-dot svg { width: 20px; height: 20px; fill: white; }
    header h1 { font-size: 18px; font-weight: 700; }
    header p  { font-size: 13px; color: var(--medium); margin-top: 2px; }

    .progress-pill {
      background: var(--green-light);
      border: 1.5px solid var(--green-mid);
      color: var(--green);
      font-weight: 700;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 20px;
    }
    .progress-bar-wrap {
      background: #e0e0e0;
      border-radius: 4px;
      height: 6px;
      width: 200px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--green);
      height: 100%;
      border-radius: 4px;
      transition: width .3s ease;
    }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .export-btn {
      background: var(--green);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      letter-spacing: .01em;
    }
    .export-btn:hover { opacity: .82; }

    main { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--medium);
      margin: 0 0 14px;
    }

    /* ── Card shell ── */
    .card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .card:hover { border-color: #d0d0d0; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .card.resolved { border-color: var(--green-mid); background: var(--green-light); }
    .card.failed   { border-color: #ffc8c8; background: #fff5f5; }

    .card-inner {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 20px;
    }

    /* ── Tick / Fail buttons ── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .tick-btn, .fail-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid #d0d0d0;
      background: var(--white);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .tick-btn:hover { border-color: var(--green); background: var(--green-light); }
    .resolved .tick-btn { background: var(--green); border-color: var(--green); }
    .tick-btn svg { display: none; }
    .resolved .tick-btn svg { display: block; }
    .fail-btn:hover { border-color: var(--danger); background: #fff0f0; }
    .failed .fail-btn { background: var(--danger); border-color: var(--danger); }
    .fail-btn svg { display: none; }
    .failed .fail-btn svg { display: block; }

    /* ── Card body ── */
    .card-body { flex: 1; min-width: 0; }

    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .issue-badge {
      font-size: 11px; font-weight: 700;
      background: var(--light);
      border: 1px solid #e0e0e0;
      color: var(--medium);
      padding: 2px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .resolved .issue-badge { background: var(--green-mid); border-color: var(--green-mid); color: var(--green); }
    .failed   .issue-badge { background: #ffeaea; border-color: #ffc8c8; color: var(--danger); }

    .priority-badge {
      font-size: 10px; font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .priority-badge.easy   { background: #e8f7ea; color: #0C911C; }
    .priority-badge.medium { background: #fff8e1; color: #e6a800; }
    .priority-badge.hard   { background: #ffeaea; color: #cc3333; }

    .card-title {
      font-size: 15px; font-weight: 700; line-height: 1.3;
      margin-bottom: 8px;
    }
    .resolved .card-title { text-decoration: line-through; color: var(--medium); }

    /* ── Bug description ── */
    .card-bug {
      font-size: 13px;
      color: #555;
      line-height: 1.55;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #f8f4f4;
      border-radius: 8px;
      border-left: 3px solid #d8d0d0;
    }
    .resolved .card-bug { color: var(--medium); background: transparent; border-left-color: var(--green-mid); }
    .failed   .card-bug { border-left-color: #ffc8c8; }

    /* ── "How it was built" note (optional per issue) ── */
    .card-note {
      font-size: 12.5px;
      color: #3d6b44;
      line-height: 1.55;
      margin: -6px 0 14px;
      padding: 9px 12px;
      background: var(--green-light);
      border-radius: 8px;
      border-left: 3px solid var(--green-mid);
    }
    .card-note strong { color: var(--green); }
    .resolved .card-note { opacity: .65; }

    /* ── "Recommended approach" note for items not built yet ── */
    .card-plan {
      font-size: 12.5px;
      color: #6b5a2e;
      line-height: 1.55;
      margin: -6px 0 14px;
      padding: 9px 12px;
      background: #fff8e1;
      border-radius: 8px;
      border-left: 3px solid #ffd980;
    }
    .card-plan strong { color: #a37800; }

    /* ── Verify section ── */
    .verify-section {
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px 14px;
      background: #fafafa;
      margin-bottom: 12px;
    }
    .resolved .verify-section { background: transparent; border-color: var(--green-mid); }
    .failed   .verify-section { background: transparent; border-color: #ffc8c8; }

    .verify-title {
      font-size: 10px; font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--medium);
      margin-bottom: 8px;
    }
    .verify-steps {
      font-size: 13px;
      color: #444;
      line-height: 1.65;
      padding-left: 18px;
      margin-bottom: 12px;
    }
    .verify-steps li { margin-bottom: 3px; }
    .resolved .verify-steps { color: var(--medium); }

    .result-row { display: flex; flex-direction: column; gap: 6px; }
    .result-pass, .result-fail {
      font-size: 12px; font-weight: 600;
      padding: 7px 10px;
      border-radius: 8px;
      line-height: 1.45;
    }
    .result-pass { background: var(--green-light); color: #0a7016; border: 1px solid var(--green-mid); }
    .result-fail { background: #fff0f0; color: #b83030; border: 1px solid #ffc8c8; }
    .resolved .result-pass { opacity: .6; }
    .resolved .result-fail { opacity: .4; }

    /* ── State label ── */
    .state-label {
      font-size: 11px; font-weight: 700;
      color: var(--medium);
      margin-top: 10px;
      display: flex; align-items: center; gap: 5px;
    }
    .state-label .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #d0d0d0;
      flex-shrink: 0;
    }
    .resolved .state-label .dot { background: var(--green); }
    .resolved .state-label { color: var(--green); }
    .failed   .state-label .dot { background: var(--danger); }
    .failed   .state-label { color: var(--danger); }

    /* ── Failure note (shown only when failed) ── */
    .fail-note {
      display: none;
      width: 100%;
      margin-top: 8px;
      border: 1.5px solid #ffcccc;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 64px;
      outline: none;
      color: var(--dark);
      background: white;
      line-height: 1.5;
    }
    .fail-note:focus { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,82,82,.1); }
    .failed .fail-note { display: block; }

    /* ── Comment section (always available) ── */
    .comment-section {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .comment-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--medium);
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: color .15s;
      line-height: 1;
    }
    .comment-btn:hover { color: var(--green); }
    .comment-btn.has-comment { color: var(--green); }
    .card-comment {
      display: none;
      width: 100%;
      margin-top: 8px;
      border: 1.5px solid #d8d8d8;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      outline: none;
      color: var(--dark);
      background: white;
      line-height: 1.5;
    }
    .card-comment.open { display: block; }
    .card-comment:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(12,145,28,.1); }

    /* ── Reset button ── */
    .reset-all {
      display: block;
      margin: 32px auto 0;
      background: none;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--medium);
      cursor: pointer;
      transition: all .15s;
    }
    .reset-all:hover { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-dot">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>
    <div>
      <h1>Security Payroll Demo — Fix Tracker</h1>
      <p>Round 1 — verify the two changes cloud Claude just shipped (wizard refresh + new-tenant seeding)</p>
    </div>
  </div>
  <div class="header-right">
    <div class="progress-pill" id="progress-pill">0 / 0 passed</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
    <button class="export-btn" onclick="exportMd()">⬇ Export to .md</button>
  </div>
</header>

<main>
  <p class="section-title">Outstanding fixes</p>
  <div id="cards"></div>
  <button class="reset-all" onclick="resetAll()">Reset all to pending</button>
</main>

<script>
  const PROJECT = 'Security Payroll Demo';

  const ISSUES = [
    {
      id: 1,
      priority: 'medium', priorityLabel: 'Several screens',
      title: 'Getting Started wizard now covers every module',
      bug: 'The onboarding wizard at /wizard was frozen at the original 7-step flow from mid-2026 and never mentioned leave management, the supervisor→payroll approvals gate, invoicing/accounting, equipment, the AI assistant, or most of admin settings — a new admin following it would miss half the app.',
      steps: [
        'Sign in as an admin (or CEO-executive) account',
        'Open /wizard (Getting Started)',
        'Read through all the steps top to bottom, and check the "Also available" section at the end',
        'Confirm the payroll-constants step only shows "done" once at least 10 constants exist (not the old threshold of 4)',
        'Confirm the "Verify payroll constants" and "Set up leave policies" steps still show as admin/CEO-only appropriately'
      ],
      pass: 'The wizard lists 13 numbered steps (company profile, payroll constants, public holidays, sites, shift types, employees, invite team, assign supervisors, roster, daily muster, approvals, leave policies, disciplinary/exits) plus an "Also available" section linking to Clients/Invoices, Accounting, Equipment, and AI Assistant. Step text matches how those features actually behave today.',
      fail: 'Any step is missing, points to the wrong page, describes behavior that doesn’t match the real screen, or the "Also available" links are broken/missing.',
      location: 'src/routes/_app.wizard.tsx',
      fix: 'Wizard rewritten in commit d76daca (PR #2) — added company/billing, public holidays, shift types, invite teammates, assign supervisors, leave policies, and attendance-approvals steps; fixed the dead shiftTypes query; corrected admin-only hint to also allow CEO-executive; raised payroll-constants "done" threshold from 4 to 10; added "Also available" section.'
    },
    {
      id: 2,
      priority: 'easy', priorityLabel: 'Quick fix',
      title: 'New tenants get seeded payroll constants, shift types, and leave policies',
      bug: 'Signing up a brand-new tenant previously only created a tenants row, a profile, and a service_items catalog — no payroll_constants, shift_types, or leave_policies rows. That silently meant a new tenant’s payroll math ran on hardcoded fallback defaults, the roster had zero shift types to assign, and there was nothing for leave requests to validate against.',
      steps: [
        'Sign up a brand-new tenant (fresh email, new company)',
        'Immediately after landing in the app, open /wizard',
        'Check step 2 "Verify payroll constants" and step 5 "Configure shift types" and step 12 "Set up leave policies"',
        'Also check the existing two live tenants (the ones that predate this fix) still have the same complete constant/shift-type/leave-policy set — nothing should have been duplicated or overwritten for them'
      ],
      pass: 'Step 2 already shows 10+ constants seeded (min wage, SSC rate/cap, PAYE threshold, Sunday/public-holiday multipliers, hour-cap policy, etc.), step 5 already shows at least Day and Night shift types, and step 12 already shows leave policies (annual/sick/maternity/compassionate) — all without the admin doing anything manually. Public holidays remain empty/unseeded on purpose (dates vary by year) and step 3 correctly still asks to add them.',
      fail: 'A new tenant lands with 0 constants / 0 shift types / 0 leave policies (wizard steps 2, 5, 12 all show "not done" with zero counts), or an existing tenant’s constants/shift types/leave policies changed unexpectedly after this migration ran.',
      location: 'supabase/migrations/20260821120000_provision_payroll_defaults_for_new_tenants.sql · handle_new_user()',
      fix: 'Migration 36cb02a (PR #3) extends handle_new_user() to seed payroll_constants, shift_types, and leave_policies for new tenants, and backfills the two existing tenants that predate the change. Already applied directly to the live Supabase project (nakvdkkezgdqxytygtqp) and checked against get_advisors with no new findings — this card is confirming the live behavior, not deploying anything.'
    },
    {
      id: 3,
      priority: 'easy', priorityLabel: 'Built — verify',
      title: 'Sunday boundary rule is selectable in Admin settings',
      bug: 'UAT-01 asked for the approved rule on shifts crossing midnight into or out of a Sunday. The rule was made configurable in the engine (decision D-01: split at midnight is the default) but there was no screen anywhere to see or change it — the only way to switch was editing the payroll_constants row by hand, so UAT-T01 and UAT-T02 could not be tested both ways.',
      steps: [
        'Sign in as an admin and open Admin settings',
        'Find the "Sunday boundary rule" card, below "Payroll constants"',
        'Confirm the current selection is "Split at midnight (default)"',
        'Confirm sunday_boundary_rule no longer appears as a number field in the "Payroll constants" list above',
        'Switch to "Majority of the shift", click "Save boundary rule", reload the page and confirm the choice stuck',
        'Switch it back to "Split at midnight (default)" and save'
      ],
      pass: 'The card shows both options with a plain-language explanation of each, the saved value survives a page reload, the Save button stays disabled until the selection actually changes, and sunday_boundary_rule is absent from the numeric constants list.',
      fail: 'The card is missing, the selection does not persist after reload, saving errors, or sunday_boundary_rule still shows as an editable number (value 0) in the constants list above.',
      location: 'src/routes/_app.admin.settings.tsx · SundayBoundaryCard',
      note: 'The rule lives in payroll_constants.value_text, not .value, so it needed its own control rather than a row in the numeric editor — the generic editor would have shown a meaningless 0 and written a number the engine never reads. Changing the rule affects the next payroll run only; finalised periods keep the figures they were calculated with.'
    },
    {
      id: 4,
      priority: 'easy', priorityLabel: 'Built — verify',
      title: 'Payroll shows the per-day calculation segments behind each payslip',
      bug: 'P-06: the engine computed per-day segments for every shift and then discarded them, so a payslip showed only totals. Payroll had no way to show a guard why a shift that crossed midnight paid what it paid.',
      steps: [
        'Open Payroll and select a pay period that has shifts crossing midnight',
        'Run the payroll draft',
        'Scroll to the "Calculation segment audit trail" card below the per-category breakdown',
        'Pick one guard who worked a Saturday-into-Sunday shift and read their segment lines'
      ],
      pass: 'Each segment line shows the date, hours, classification, the multiplier applied and the night hours within it. The segment hours for a shift add up exactly to that shift length — no minute is lost or counted twice.',
      fail: 'The card does not appear, segments are missing for a shift that crossed midnight, or the segment hours do not sum to the shift duration.',
      location: 'src/routes/_app.payroll.tsx:738 · supabase/migrations/20260830180000_sunday_boundary_and_payroll_segments.sql',
      note: 'The roster is untouched — one shift is still one stored record with its real start and end timestamps. Segments are a calculation and audit artifact stored on the payroll run, not a change to how shifts are recorded.'
    },
    {
      id: 5,
      priority: 'easy', priorityLabel: 'Built — verify',
      title: 'Sunday and premium report for management',
      bug: 'UAT-16: management had no employee-level view of who worked Sunday and premium shifts, how many hours, and what each earned.',
      steps: [
        'Open Payroll and select a period that contains Sunday or public-holiday work',
        'Run or open the draft',
        'Scroll to the "Sunday & premium report" section',
        'Check one guard against their payslip figures',
        'Click the CSV download and open the file'
      ],
      pass: 'The table lists every guard with Sunday hours and pay, call-in Sunday hours and pay, public-holiday figures and a total premium pay column. Guards with no premium hours are excluded. The CSV matches what is on screen.',
      fail: 'A guard with Sunday hours is missing, the pay figures disagree with the payslip, or the CSV export fails or is empty.',
      location: 'src/routes/_app.payroll.tsx',
      note: 'Built from the payroll run figures rather than re-derived from the roster, so the report cannot drift from what was actually paid.'
    },
    {
      id: 6,
      priority: 'easy', priorityLabel: 'Built — verify',
      title: 'Rostered Sunday, call-in Sunday and public holiday are paid and shown separately',
      bug: 'UAT-03: normal rostered Sunday work and call-in or relief work attract different rates (1.5x and 2x), and the system did not distinguish them on the payslip.',
      steps: [
        'Roster a guard for a normal Sunday shift and a second guard as a Sunday call-in',
        'Run payroll for that period',
        'Open each payslip and read the hours breakdown',
        'Check the same split appears on the downloaded payslip PDF'
      ],
      pass: 'Rostered Sunday hours are listed separately from call-in Sunday hours and from public-holiday hours, each with its own amount, on screen and in the PDF. Rostered pays the agreed multiplier (1.5x) and call-in pays the default (2x).',
      fail: 'The two Sunday types are combined into one line, or both are paid at the same rate.',
      location: 'src/lib/payroll-engine.ts · src/lib/payslip-pdf.ts · src/routes/_app.payroll.tsx',
      note: 'No further contractual Sunday category is modelled. Decision 2026-09-03 kept the blanket 1.5x for rostered Sundays without a per-employee consent gate — the exposure under Labour Act s.21 is recorded in uat/2026-08-20/DECISIONS-2026-09-03.md section 2.'
    },
    {
      id: 7,
      priority: 'medium', priorityLabel: 'Built — verify',
      title: 'Leave planner flags guards due and overdue for annual leave',
      bug: 'UAT-11 and UAT-12: leave cycles are anchored per employee and the Labour Act gives a four-month deadline after each cycle ends, but nothing told Operations who was approaching or past that date, or what taking them off would do to site coverage.',
      steps: [
        'Open the Leave page',
        'Find the "Leave planner — due & overdue for annual leave" card',
        'Read the list of guards, their deadline dates and balances',
        'Confirm anyone already past their deadline is marked overdue and visually distinct',
        'Check the coverage-risk indicator against the home-site staffing for that guard'
      ],
      pass: 'The planner lists guards whose annual leave deadline falls in the next 90 days, shows the statutory deadline date and current balance for each, marks overdue rows clearly, gives a running overdue count, and shows a high/medium/low coverage risk per guard.',
      fail: 'A guard past their deadline is missing, the deadline date is wrong for their cycle, or no coverage risk is shown.',
      location: 'src/routes/_app.leave.tsx · supabase/migrations/20260821153000_leave_cycle_latest_compliant_date.sql',
      note: 'The deadline is a generated column on leave_cycles (cycle end plus four months) and is null for sick and compassionate leave, which have no equivalent statutory scheduling rule. The six-month extension is deliberately not modelled — capturing that written agreement is UAT-13 work.'
    },
    {
      id: 8,
      priority: 'medium', priorityLabel: 'Built — verify',
      title: 'Unfillable coverage is recorded as a shortage instead of disappearing',
      bug: 'UAT-08 and UAT-10: when the scheduler could not fill required coverage with a compliant guard, the gap surfaced as a toast that vanished. Operations and HR had no record to plan recruitment from, and the temptation was to overwork whoever was available.',
      steps: [
        'Open the Schedule page for a week with a site that cannot be fully covered',
        'Run auto-fill or generate coverage so at least one slot cannot be filled',
        'Look for the red "Coverage shortages · last 30 days" panel and expand it',
        'Read one entry and check it names the site, date, shift and how many slots went unfilled',
        'Confirm the entry lists the guards who were considered and the reason each was excluded'
      ],
      pass: 'Every unfilled slot creates a persistent record. The expanded panel groups shortages by site and shows date, day or night shift, required versus unmet count, and a per-guard exclusion reason. The record survives a page reload.',
      fail: 'A shortage is only a toast, the panel does not appear, exclusion reasons are missing, or the record disappears on reload.',
      location: 'src/routes/_app.schedule.tsx:1143 · supabase/migrations/20260821164000_schedule_shortage_register.sql',
      note: 'This is the register only. The weekly Ops and HR report grouping recurring shortages by site, shift and required skill — decided 2026-09-03 as the whole of UAT-17 — is not built yet.'
    },
    {
      id: 9,
      priority: 'medium', priorityLabel: 'Built — verify',
      title: 'Auto-fill prefers guards who have not had a recent premium Sunday',
      bug: 'UAT-06: premium Sunday work kept going to the same familiar guards. Candidate selection needed to favour whoever has had fewer recent premium opportunities and lower hours.',
      steps: [
        'Give one guard a Sunday day shift this week',
        'Move to a following week and auto-fill another Sunday day shift at the same site',
        'Check which guard the system proposes first',
        'Repeat with a guard who has had no Sunday work in the last three months'
      ],
      pass: 'A guard with no recent premium Sunday is ranked ahead of one who has just had one, all else being equal. The guard who worked recently is not hidden — they are ranked lower, and can still be assigned manually.',
      fail: 'Ranking ignores premium history entirely, or a recently-premiumed guard is blocked outright rather than deprioritised.',
      location: 'src/routes/_app.schedule.tsx:447',
      note: 'Ranking signal only, over a fixed 90-day lookback. Decision 2026-09-03 replaces this with a configurable window defaulting to one premium opportunity per calendar month, counting every Sunday-working shift including call-ins, and excluding over-cap guards from suggestions with a visible reason. That change is not built yet — what ships today is the 90-day preference.'
    },
    {
      id: 10,
      priority: 'medium', priorityLabel: 'Built — verify',
      title: 'One guard failing no longer kills the whole payroll run',
      bug: 'A single employee with bad data threw out of the payroll calculation and aborted the entire run, with no indication of who caused it. Separately, the run-payroll edge function had never actually been deployed to the live project, so payroll in the deployed app had been failing outright since 19 August rather than falling back to anything.',
      steps: [
        'Open Payroll and select an open period',
        'Click Run payroll',
        'Confirm the draft is produced and the calculated guards are listed',
        'If any guard could not be calculated, confirm they are named with the reason instead of the whole run failing'
      ],
      pass: 'The run completes and produces a draft. Any employee whose calculation failed is reported by name with a reason, and the remaining employees are still calculated and saved.',
      fail: 'The run aborts entirely on one bad employee, or a failure is swallowed silently so a guard is quietly left out of the draft with no warning.',
      location: 'supabase/functions/run-payroll/index.ts · src/routes/_app.payroll.tsx',
      note: 'Deployed to the live project on 2026-09-02 and verified by reading the deployed source back, not just the CLI success line. Payroll is server-authoritative — the browser receives the display model only and is never the writer of record.'
    },
    {
      id: 11,
      priority: 'easy', priorityLabel: 'Built — verify',
      title: 'Namibian public holidays are computed rather than typed in by hand',
      bug: 'The public holiday calendar was hand-entered per tenant. The live 2025 calendar holds only 7 rows, all before 25 May, so six holidays are missing and any shift worked on them was paid as a normal day.',
      steps: [
        'Open the public holidays screen and view the calendar for 2026',
        'Confirm the fixed-date holidays and the moveable Easter-linked dates are present',
        'Find a public holiday that falls on a Sunday and confirm the following Monday also appears as a holiday',
        'Roster a guard across that Sunday and Monday, run payroll, and check both days pay the public-holiday multiplier'
      ],
      pass: 'The 2026 calendar is complete, moveable feasts are correct, and a holiday falling on a Sunday adds the following Monday without moving off the Sunday. Both days attract the 2x multiplier.',
      fail: 'Holidays are missing, an Easter-linked date is wrong, or a Sunday holiday moves to Monday instead of adding it.',
      location: 'supabase/migrations/20260901183000_namibian_public_holiday_calendar.sql',
      note: '2025 is deliberately left alone — backfilling it would create a calendar that disagrees with what finalised 2025 periods actually paid. It is recorded as known-bad demo data. The Sunday-plus-Monday reading follows Public Holidays Act 26 of 1990 s.1(2) and is on the employee-protective side of an ambiguity that has not been reviewed by counsel; it is question (a) in the 2026-09-04 email to the client.'
    }
  ];

  /* ===================== ENGINE (generic) ===================== */
  const slug         = PROJECT.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const STORAGE_KEY  = 'fixtracker:' + slug + ':state';
  const NOTES_KEY    = 'fixtracker:' + slug + ':notes';
  const COMMENTS_KEY = 'fixtracker:' + slug + ':comments';
  const TOTAL        = ISSUES.length;
  const IDS          = ISSUES.map(i => i.id);
  const BY_ID        = Object.fromEntries(ISSUES.map(i => [i.id, i]));

  const TICK_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
  const X_SVG    = '<svg viewBox="0 0 24 24" width="14" height="14" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
  const MSG_SVG  = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      Object.keys(raw).forEach(id => { if (typeof raw[id] === 'number') raw[id] = { v: raw[id], auto: false }; });
      return raw;
    } catch { return {}; }
  }
  function save(s)        { localStorage.setItem(STORAGE_KEY,  JSON.stringify(s)); }
  function loadNotes()    { try { return JSON.parse(localStorage.getItem(NOTES_KEY)    || '{}'); } catch { return {}; } }
  function saveNotes(n)   { localStorage.setItem(NOTES_KEY,    JSON.stringify(n)); }
  function loadComments() { try { return JSON.parse(localStorage.getItem(COMMENTS_KEY) || '{}'); } catch { return {}; } }
  function saveComments(c){ localStorage.setItem(COMMENTS_KEY, JSON.stringify(c)); }

  function verdictToV(v) { return v === 'pass' ? 1 : v === 'fail' ? 2 : 0; }
  function seedFromVerdicts(state) {
    let changed = false;
    ISSUES.forEach(it => {
      if (!it.verdict) return;
      const seeded = verdictToV(it.verdict);
      const entry = state[it.id];
      if (!entry || entry.auto) {
        if (!entry || entry.v !== seeded || entry.auto !== true) {
          state[it.id] = { v: seeded, auto: true };
          changed = true;
        }
      }
    });
    if (changed) save(state);
    return state;
  }

  function buildCards() {
    document.getElementById('cards').innerHTML = ISSUES.map(it => `
      <div class="card" id="card-${it.id}">
        <div class="card-inner">
          <div class="btn-group">
            <button class="tick-btn" onclick="togglePass(${JSON.stringify(it.id)})" title="Mark passed">${TICK_SVG}</button>
            <button class="fail-btn" onclick="markFail(${JSON.stringify(it.id)})" title="Mark failed">${X_SVG}</button>
          </div>
          <div class="card-body">
            <div class="card-top">
              <span class="issue-badge">Issue #${esc(it.id)}</span>
              <span class="priority-badge ${it.priority || 'medium'}">${esc(it.priorityLabel || it.priority)}</span>
            </div>
            <div class="card-title">${esc(it.title)}</div>
            <div class="card-bug">${esc(it.bug)}</div>
            ${it.note ? `<div class="card-note"><strong>How it was built:</strong> ${esc(it.note)}</div>` : ''}
            ${it.plan ? `<div class="card-plan"><strong>Recommended approach:</strong> ${esc(it.plan)}</div>` : ''}
            <div class="verify-section">
              <div class="verify-title">How to verify</div>
              <ol class="verify-steps">${(it.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
              <div class="result-row">
                <div class="result-pass">✅ Green light: ${esc(it.pass)}</div>
                <div class="result-fail">❌ Red light: ${esc(it.fail)}</div>
              </div>
            </div>
            <div class="state-label"><span class="dot"></span><span class="label-text">Pending</span></div>
            <textarea class="fail-note" id="note-${it.id}" oninput="saveNote(${JSON.stringify(it.id)}, this.value)" placeholder="What did you see instead? Be specific — e.g. 'panel still on left', 'file picker didn't open'…"></textarea>
            <div class="comment-section">
              <button class="comment-btn" id="comment-btn-${it.id}" onclick="toggleComment(${JSON.stringify(it.id)})">${MSG_SVG}<span class="btn-label">Add comment</span></button>
              <textarea class="card-comment" id="comment-${it.id}" oninput="saveComment(${JSON.stringify(it.id)}, this.value)" placeholder="Leave a comment about this fix…"></textarea>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  function togglePass(id) {
    const s = load();
    const cur = s[id]?.v ?? 0;
    s[id] = { v: cur === 1 ? 0 : 1, auto: false };
    save(s); render(s);
  }

  function markFail(id) {
    const s = load();
    const cur = s[id]?.v ?? 0;
    s[id] = { v: cur === 2 ? 0 : 2, auto: false };
    save(s); render(s);
    if (s[id].v === 2) setTimeout(() => document.getElementById('note-' + id)?.focus(), 50);
  }

  function saveNote(id, text)    { const n = loadNotes();    n[id] = text; saveNotes(n); }

  function saveComment(id, text) {
    const c = loadComments();
    c[id] = text;
    saveComments(c);
    const btn = document.getElementById('comment-btn-' + id);
    if (btn) btn.classList.toggle('has-comment', text.trim().length > 0);
  }

  function toggleComment(id) {
    const ta  = document.getElementById('comment-' + id);
    const btn = document.getElementById('comment-btn-' + id);
    if (!ta || !btn) return;
    const isOpen = ta.classList.toggle('open');
    const lbl = btn.querySelector('.btn-label');
    lbl.textContent = isOpen ? 'Hide comment' : (ta.value.trim() ? 'Edit comment' : 'Add comment');
    if (isOpen) ta.focus();
  }

  function resetAll() { if (!confirm('Reset all items back to pending?')) return; save({}); render({}); }

  function render(state) {
    const notes = loadNotes();
    let resolved = 0, failed = 0;
    IDS.forEach(id => {
      const card  = document.getElementById('card-' + id);
      const label = card.querySelector('.label-text');
      const note  = document.getElementById('note-' + id);
      const entry = state[id];
      const s     = entry?.v ?? 0;
      const auto  = !!entry?.auto;
      const autoTag = auto ? ' — auto (Claude verified, not yet clicked by you)' : '';
      card.classList.remove('resolved', 'failed');
      if (s === 1)      { card.classList.add('resolved'); label.textContent = 'Passed ✓' + autoTag; resolved++; }
      else if (s === 2) { card.classList.add('failed');   label.textContent = 'Failed ✕' + autoTag; failed++; if (note && notes[id]) note.value = notes[id]; }
      else              { label.textContent = 'Pending'; }
    });
    const pct = TOTAL ? Math.round((resolved / TOTAL) * 100) : 0;
    document.getElementById('progress-pill').textContent =
      resolved + ' / ' + TOTAL + ' passed' + (failed ? '  ·  ' + failed + ' failed' : '');
    document.getElementById('progress-bar').style.width = pct + '%';
  }

  function buildMd() {
    const state    = load();
    const notes    = loadNotes();
    const comments = loadComments();
    const stamp    = new Date().toLocaleString();
    const icon = (s) => s === 1 ? '✅' : s === 2 ? '❌' : '⏳';
    const text = (s) => s === 1 ? 'Passed' : s === 2 ? 'Failed' : 'Pending';
    const vOf = (id) => state[id]?.v ?? 0;
    const resolved = IDS.filter(id => vOf(id) === 1).length;
    const failed   = IDS.filter(id => vOf(id) === 2).length;
    const pending  = TOTAL - resolved - failed;

    let md = `# ${PROJECT} — Fix Tracker (test results)\n`;
    md += `_Exported by Philip: ${stamp}_\n\n`;
    md += `> **For Claude:** Philip's testing handoff. Work the ❌ Failed items first — read his note `;
    md += `under each, fix the code at the listed location, then re-run \`/fix-tracker\` to regenerate `;
    md += `tracker.html for the next round (failed items carry forward, passed items drop off). `;
    md += `⏳ Pending = untested. ✅ Passed = done, leave it.\n\n`;
    md += `## Summary\n- ✅ Passed: ${resolved} / ${TOTAL}\n- ❌ Failed: ${failed} / ${TOTAL}\n- ⏳ Pending: ${pending} / ${TOTAL}\n\n---\n\n`;

    const order = [...IDS].sort((a, b) => {
      const rank = (s) => s === 2 ? 0 : s === 0 ? 1 : 2;
      return rank(vOf(a)) - rank(vOf(b));
    });
    order.forEach(id => {
      const s       = vOf(id);
      const auto    = !!state[id]?.auto;
      const it      = BY_ID[id] || {};
      const note    = (notes[id]    ?? '').trim();
      const comment = (comments[id] ?? '').trim();
      md += `## ${icon(s)} Issue #${id} — ${it.title || ''}\n`;
      md += `**Status:** ${text(s)}${auto ? ' (auto-seeded from a Claude verify pass — not yet personally clicked by Philip)' : ''}\n`;
      md += `**Location:** \`${it.location || ''}\`\n`;
      md += `\n**The bug (UX):** ${it.bug || ''}\n`;
      md += `\n**Fix to apply:** ${it.fix || ''}\n`;
      if (it.note) md += `\n**How it was built:** ${it.note}\n`;
      if (note)    md += `\n**Philip's failure note:** ${note}\n`;
      if (comment) md += `\n**Philip's comment:** ${comment}\n`;
      md += '\n';
    });
    return md;
  }

  async function exportMd() {
    const md = buildMd();
    const ts = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const fname = `${slug}-round-${ts}.md`;

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: fname,
          types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }],
        });
        const w = await handle.createWritable();
        await w.write(md);
        await w.close();
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    const blob = new Blob([md], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // init
  buildCards();
  const _initNotes    = loadNotes();
  const _initComments = loadComments();
  IDS.forEach(id => {
    const noteEl = document.getElementById('note-' + id);
    if (noteEl && _initNotes[id]) noteEl.value = _initNotes[id];

    const commentEl  = document.getElementById('comment-' + id);
    const commentBtn = document.getElementById('comment-btn-' + id);
    if (commentEl && _initComments[id]) {
      commentEl.value = _initComments[id];
      commentEl.classList.add('open');
      commentBtn.classList.add('has-comment');
      commentBtn.querySelector('.btn-label').textContent = 'Edit comment';
    }
  });
  render(seedFromVerdicts(load()));
</script>
</body>
